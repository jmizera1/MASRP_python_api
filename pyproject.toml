[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masrp_sdk"
version = "0.1.0"
description = "Python API wrapper for the MAS Research Platform"
authors = [
    { name = "Jan Mizera" },
    { name = "Adam Kurdybelski" },
    { name = "Błażej Michalak" },
]
requires-python = ">=3.10"
dependencies = ["httpx>=0.24.0", "pydantic>=2.0.0", "pandas>=2.0.0"]

[tool.setuptools.packages.find]
include = ["research*"]
